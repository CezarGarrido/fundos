[package]
name = "fundos-backend"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
fundos-common = { path = "../common" }

# Web server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Async
tokio.workspace = true
tokio-util = "0.7"

# Data processing
polars.workspace = true
smartcore.workspace = true
kalman_filters.workspace = true

# Data sources
yahoo_finance_api.workspace = true
cached-path.workspace = true
