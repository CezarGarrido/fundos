[workspace]
members = ["common", "backend", "frontend"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Cezar Garrido <cezar.cgb18@gmail.com>"]
edition = "2021"
rust-version = "1.80"

# ── Profile shared across all crates ────────────────────────────────
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.19", features = ["serde"] }
tokio = { version = "1.37", features = ["full"] }
log = "0.4"
thiserror = "1.0"
once_cell = "1.19"
regex = "1.10"
jiff = "0.2"

# egui / eframe
egui = "0.34"
eframe = { version = "0.34", default-features = false }
egui_dock = "0.19"
egui_extras = { version = "0.34", default-features = true, features = ["datepicker"] }
egui-phosphor = "0.12"
egui_plot = "0.35"
egui-toast = "0.20"
egui_logger = "0.10"

# backend heavy
polars = { version = "0.32.0", features = ["lazy", "strings", "describe", "json"] }
smartcore = "0.5.0"
kalman_filters = "1.0.1"
yahoo_finance_api = "4.1.0"
zip = "2.1.5"
cached-path = { version = "0.6.1", default-features = false, features = ["rustls-tls"] }
encoding_rs = "0.8"
encoding_rs_io = "0.1"
lru = "0.12"
config = "0.14"
nix = { version = "0.26", features = ["fs", "mman"] }
glob = "0.3"

[profile.release]
opt-level = 2
strip = true
lto = true

[profile.dev.package."*"]
opt-level = 2
